<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>{{.Article.Title}} | {{.Settings.Title}}</title>
    <link rel="stylesheet" type="text/css" href="/v/main-{hash}.css" />
    <link rel="icon" href="/v/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <nav>
      {{range .Pages}}<a href="/{{.}}">{{.}}</a>
      {{end}}
    </nav>
    <div class="content">
      <div class="art">
        <div class="art-item">
          <h1><a>{{.Article.Title}}</a></h1>
          <div class="anno">
            <span>
              <mod-icon name="date"></mod-icon>
              {{.Article.Created | formatDate | unsafeHTML}}</span
            >
            <span>
              <mod-icon name="tag"></mod-icon>
              {{range .Article.Tags}}
              <mod-tag i="{{.ID}}" color="{{.Color}}">{{.Name}}</mod-tag>
              {{end}}
            </span>
          </div>
        </div>
        <div class="markdown-body">{{.Article.ArticleContent.HTML | unsafeHTML}}</div>
        <mod-comment id="{{.Article.ID}}" />
      </div>
    </div>
    <mod-box h="{{.Settings.MarginBottom}}"></mod-box>
  </body>
  <div class="bg" style="{{.Settings.Background | unsafeCSS}}"></div>
  <mod-kit />
  <script src="/v/main-{hash}.js"></script>
  <script type="module" src="/v/mod/index-{hash}.js"></script>
  <script type="module" src="/v/mod/kit-{hash}.js"></script>
  <script type="module" src="/v/mod/comment-{hash}.js"></script>
</html>
